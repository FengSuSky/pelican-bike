<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      --sky-top: #7ec8e8;
      --sky-mid: #c8eaf7;
      --sand: #f4e2c4;
      --sea: #3aa0c7;
      --ink: #1f2a32;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", serif;
      overflow: hidden;
      color: #234;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      background:
        linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, #e8f6c8 62%, var(--sand) 78%, #e8c98a 100%);
      overflow: hidden;
    }

    .sun {
      position: absolute;
      top: 8%;
      right: 14%;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff6c8, #ffd15a 55%, #f0a03a);
      box-shadow: 0 0 0 18px rgba(255, 214, 90, 0.22), 0 0 80px 20px rgba(255, 190, 70, 0.35);
      animation: pulse 6s ease-in-out infinite;
    }

    @keyframes pulse {
      50% { transform: scale(1.06); }
    }

    .cloud {
      position: absolute;
      background: #fff;
      border-radius: 40px;
      opacity: 0.88;
      filter: drop-shadow(0 8px 10px rgba(40, 80, 110, 0.08));
      animation: drift linear infinite;
    }
    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      background: #fff;
      border-radius: 50%;
    }
    .c1 { top: 12%; left: -20%; width: 140px; height: 42px; animation-duration: 38s; }
    .c1::before { width: 58px; height: 58px; top: -30px; left: 22px; }
    .c1::after { width: 78px; height: 78px; top: -42px; left: 58px; }
    .c2 { top: 22%; left: -30%; width: 100px; height: 32px; animation-duration: 52s; animation-delay: -12s; opacity: 0.7; }
    .c2::before { width: 42px; height: 42px; top: -22px; left: 16px; }
    .c2::after { width: 56px; height: 56px; top: -30px; left: 42px; }
    .c3 { top: 8%; left: -10%; width: 180px; height: 48px; animation-duration: 46s; animation-delay: -28s; opacity: 0.75; }
    .c3::before { width: 70px; height: 70px; top: -36px; left: 28px; }
    .c3::after { width: 90px; height: 90px; top: -48px; left: 78px; }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(140vw); }
    }

    .sea {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 26%;
      height: 16%;
      background: linear-gradient(180deg, #5ec4e0, var(--sea));
      overflow: hidden;
    }
    .wave {
      position: absolute;
      width: 200%;
      height: 28px;
      left: -20%;
      background: repeating-linear-gradient(
        90deg,
        transparent 0 40px,
        rgba(255,255,255,0.25) 40px 80px
      );
      border-radius: 50%;
      animation: waves 8s linear infinite;
    }
    .wave.w2 { top: 18px; opacity: 0.5; animation-duration: 12s; animation-direction: reverse; }

    @keyframes waves {
      to { transform: translateX(80px); }
    }

    .road {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 28%;
      background: linear-gradient(180deg, #d8b57a 0%, #c9a066 18%, #b8894e 100%);
    }
    .dashes {
      position: absolute;
      top: 22%;
      left: 0;
      width: 200%;
      height: 8px;
      background: repeating-linear-gradient(90deg, #f6edd4 0 48px, transparent 48px 96px);
      animation: scroll 1.1s linear infinite;
    }
    .pebbles {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 10% 70%, #a07540 2px, transparent 3px),
        radial-gradient(circle at 30% 50%, #8d6638 1.5px, transparent 2.5px),
        radial-gradient(circle at 55% 80%, #b08a52 2px, transparent 3px),
        radial-gradient(circle at 78% 60%, #9a7040 1.5px, transparent 2.5px),
        radial-gradient(circle at 92% 75%, #c09a60 2px, transparent 3px);
      background-size: 220px 90px;
      animation: scroll 1.1s linear infinite;
      opacity: 0.55;
    }

    @keyframes scroll {
      to { transform: translateX(-96px); }
    }

    .rider {
      position: absolute;
      left: 50%;
      bottom: 14%;
      width: min(520px, 88vw);
      transform: translateX(-50%);
      filter: drop-shadow(0 18px 12px rgba(40, 30, 10, 0.28));
      animation: bounce 0.55s ease-in-out infinite;
    }

    @keyframes bounce {
      50% { transform: translateX(-50%) translateY(-6px); }
    }

    .caption {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 2;
      text-shadow: 0 2px 0 rgba(255,255,255,0.4);
    }
    .caption h1 {
      font-size: clamp(28px, 5vw, 48px);
      letter-spacing: 0.08em;
      font-weight: 700;
      color: #1e3a4a;
    }
    .caption p {
      margin-top: 6px;
      font-size: 15px;
      letter-spacing: 0.22em;
      color: #3d5d6e;
    }

    .hint {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      letter-spacing: 0.16em;
      color: #5a4020;
      opacity: 0.75;
      z-index: 2;
    }

    .scene.paused .dashes,
    .scene.paused .pebbles,
    .scene.paused .cloud,
    .scene.paused .wave,
    .scene.paused .rider,
    .scene.paused .crank,
    .scene.paused .wheel,
    .scene.paused .leg,
    .scene.paused .wing,
    .scene.paused .sun {
      animation-play-state: paused;
    }
  </style>
</head>
<body>
  <div class="stage scene" id="scene">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="sea">
      <div class="wave"></div>
      <div class="wave w2"></div>
    </div>
    <div class="road">
      <div class="dashes"></div>
      <div class="pebbles"></div>
    </div>

    <div class="caption">
      <h1>鹈鹕骑自行车</h1>
      <p>海边兜风 · 点击画面可暂停</p>
    </div>

    <svg class="rider" viewBox="0 0 640 420" role="img" aria-label="一只鹈鹕正在骑自行车">
      <defs>
        <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f7f4ee"/>
          <stop offset="1" stop-color="#d9d2c4"/>
        </linearGradient>
        <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f3b56a"/>
          <stop offset="1" stop-color="#d07a3a"/>
        </linearGradient>
        <style>
          .wheel { transform-origin: center; animation: spin 0.7s linear infinite; }
          .crank { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 0.7s linear infinite; }
          .leg { transform-box: fill-box; transform-origin: 8px 8px; }
          .leg-f { animation: pedalF 0.7s linear infinite; }
          .leg-b { animation: pedalB 0.7s linear infinite; }
          .wing { transform-box: fill-box; transform-origin: 18px 40px; animation: flap 0.7s ease-in-out infinite; }
          .eye { animation: blink 3.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
          @keyframes spin { to { transform: rotate(360deg); } }
          @keyframes pedalF {
            0% { transform: rotate(20deg); }
            50% { transform: rotate(-35deg); }
            100% { transform: rotate(20deg); }
          }
          @keyframes pedalB {
            0% { transform: rotate(-35deg); }
            50% { transform: rotate(20deg); }
            100% { transform: rotate(-35deg); }
          }
          @keyframes flap {
            0%, 100% { transform: rotate(8deg); }
            50% { transform: rotate(-14deg); }
          }
          @keyframes blink {
            0%, 92%, 100% { transform: scaleY(1); }
            96% { transform: scaleY(0.08); }
          }
        </style>
      </defs>

      <!-- bicycle shadow -->
      <ellipse cx="318" cy="368" rx="168" ry="14" fill="rgba(60,40,10,0.22)"/>

      <!-- rear wheel -->
      <g class="wheel" transform="translate(168 292)">
        <circle r="68" fill="none" stroke="#2b3038" stroke-width="10"/>
        <circle r="58" fill="none" stroke="#6a7380" stroke-width="2"/>
        <g stroke="#2b3038" stroke-width="3">
          <line x1="0" y1="-58" x2="0" y2="58"/>
          <line x1="-58" y1="0" x2="58" y2="0"/>
          <line x1="-41" y1="-41" x2="41" y2="41"/>
          <line x1="41" y1="-41" x2="-41" y2="41"/>
        </g>
        <circle r="12" fill="#d9c27a" stroke="#2b3038" stroke-width="3"/>
      </g>

      <!-- front wheel -->
      <g class="wheel" transform="translate(468 292)">
        <circle r="68" fill="none" stroke="#2b3038" stroke-width="10"/>
        <circle r="58" fill="none" stroke="#6a7380" stroke-width="2"/>
        <g stroke="#2b3038" stroke-width="3">
          <line x1="0" y1="-58" x2="0" y2="58"/>
          <line x1="-58" y1="0" x2="58" y2="0"/>
          <line x1="-41" y1="-41" x2="41" y2="41"/>
          <line x1="41" y1="-41" x2="-41" y2="41"/>
        </g>
        <circle r="12" fill="#d9c27a" stroke="#2b3038" stroke-width="3"/>
      </g>

      <!-- frame -->
      <g fill="none" stroke="#2b3038" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M168 292 L278 168 L430 168 L468 292"/>
        <path d="M278 168 L278 248 L168 292"/>
        <path d="M278 248 L430 168"/>
        <path d="M430 168 L418 128"/>
      </g>
      <!-- seat -->
      <path d="M248 160 Q278 148 318 158" fill="#2b3038"/>
      <!-- handlebar -->
      <path d="M418 128 C448 118, 470 128, 478 148" fill="none" stroke="#2b3038" stroke-width="8" stroke-linecap="round"/>
      <circle cx="478" cy="150" r="7" fill="#c45c3a"/>

      <!-- crank -->
      <g class="crank" transform="translate(278 248)">
        <circle r="16" fill="#d9c27a" stroke="#2b3038" stroke-width="4"/>
        <line x1="0" y1="0" x2="0" y2="34" stroke="#2b3038" stroke-width="6" stroke-linecap="round"/>
        <rect x="-14" y="30" width="28" height="8" rx="3" fill="#2b3038"/>
      </g>

      <!-- pelican body -->
      <g>
        <!-- tail -->
        <path d="M150 188 Q118 200 108 230 Q148 214 168 208 Z" fill="#ece7dc" stroke="#2b3038" stroke-width="3"/>
        <!-- wing -->
        <path class="wing" d="M210 168 Q168 120 132 96 Q188 128 236 150 Q258 168 248 188 Z" fill="#f3efe6" stroke="#2b3038" stroke-width="3"/>
        <!-- body -->
        <ellipse cx="236" cy="188" rx="92" ry="58" fill="url(#body)" stroke="#2b3038" stroke-width="4"/>
        <!-- chest patch -->
        <ellipse cx="258" cy="204" rx="48" ry="30" fill="#fff"/>

        <!-- back leg -->
        <g class="leg leg-b" transform="translate(232 232)">
          <path d="M0 0 L8 42 L22 58" fill="none" stroke="#e8a03a" stroke-width="8" stroke-linecap="round"/>
          <path d="M22 58 L38 54 L34 64 L22 62" fill="#d07a3a" stroke="#2b3038" stroke-width="2"/>
        </g>
        <!-- front leg -->
        <g class="leg leg-f" transform="translate(268 228)">
          <path d="M0 0 L4 38 L-8 56" fill="none" stroke="#f0b24a" stroke-width="8" stroke-linecap="round"/>
          <path d="M-8 56 L8 62 L-2 70 L-16 62" fill="#d07a3a" stroke="#2b3038" stroke-width="2"/>
        </g>

        <!-- neck -->
        <path d="M300 168 C338 120, 360 108, 392 128" fill="none" stroke="#f0ebe2" stroke-width="28" stroke-linecap="round"/>
        <path d="M300 168 C338 120, 360 108, 392 128" fill="none" stroke="#2b3038" stroke-width="4" stroke-linecap="round"/>

        <!-- head -->
        <ellipse cx="412" cy="128" rx="38" ry="30" fill="#f7f3ec" stroke="#2b3038" stroke-width="4"/>
        <!-- eye -->
        <g class="eye">
          <circle cx="422" cy="120" r="8" fill="#fff" stroke="#2b3038" stroke-width="2"/>
          <circle cx="424" cy="120" r="4" fill="#1a1a1a"/>
          <circle cx="425.5" cy="118.5" r="1.4" fill="#fff"/>
        </g>
        <!-- bill -->
        <path d="M444 128 L538 148 L444 150 Z" fill="#f2c14b" stroke="#2b3038" stroke-width="3"/>
        <path d="M444 150 Q490 198 538 148 L444 150 Z" fill="url(#pouch)" stroke="#2b3038" stroke-width="3"/>
        <!-- crest -->
        <path d="M392 108 Q378 78 402 92 Q388 70 412 88" fill="none" stroke="#2b3038" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- tiny fish in pouch -->
      <g transform="translate(492 164) rotate(-12)">
        <ellipse cx="0" cy="0" rx="16" ry="7" fill="#6ec6b0" stroke="#2b3038" stroke-width="2"/>
        <polygon points="14,0 24,-7 24,7" fill="#4aa892" stroke="#2b3038" stroke-width="2"/>
        <circle cx="-6" cy="-1" r="1.6" fill="#1a1a1a"/>
      </g>
    </svg>

    <p class="hint">咔嚓咔嚓 · 鹈鹕去赶海</p>
  </div>

  <script>
    const scene = document.getElementById("scene");
    scene.addEventListener("click", () => scene.classList.toggle("paused"));
  </script>
</body>
</html>
