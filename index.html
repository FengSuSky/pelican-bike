<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      --sky-top: #7ec8e3;
      --sky-mid: #c8e8f5;
      --sky-bot: #f7e7c3;
      --grass: #6db36d;
      --grass-dark: #4f9a52;
      --road: #5c5c5c;
      --road-line: #f4d35e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
      overflow: hidden;
      background: var(--sky-top);
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        180deg,
        #6bb8d8 0%,
        #9ad4ea 28%,
        #d7eef7 58%,
        #f6e4b8 78%,
        #e8c98a 100%
      );
    }

    .sun {
      position: absolute;
      top: 8%;
      right: 12%;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff7c2, #ffd166 55%, #f4a261 100%);
      box-shadow: 0 0 60px 18px rgba(255, 209, 102, 0.55);
      animation: pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .cloud {
      position: absolute;
      background: #fff;
      border-radius: 50px;
      opacity: 0.92;
      filter: drop-shadow(0 8px 10px rgba(80, 120, 150, 0.12));
      animation: drift linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: #fff;
      border-radius: 50%;
    }

    .c1 { width: 140px; height: 42px; top: 12%; left: -20%; animation-duration: 42s; }
    .c1::before { width: 58px; height: 58px; top: -30px; left: 22px; }
    .c1::after  { width: 78px; height: 78px; top: -42px; left: 58px; }

    .c2 { width: 180px; height: 48px; top: 22%; left: -30%; animation-duration: 56s; animation-delay: -12s; }
    .c2::before { width: 70px; height: 70px; top: -36px; left: 28px; }
    .c2::after  { width: 90px; height: 90px; top: -50px; left: 72px; }

    .c3 { width: 110px; height: 34px; top: 8%; left: -10%; animation-duration: 36s; animation-delay: -20s; }
    .c3::before { width: 46px; height: 46px; top: -24px; left: 16px; }
    .c3::after  { width: 60px; height: 60px; top: -32px; left: 46px; }

    @keyframes drift {
      from { transform: translateX(0); }
      to   { transform: translateX(140vw); }
    }

    .hills {
      position: absolute;
      bottom: 22%;
      left: 0;
      width: 100%;
      height: 28%;
      background:
        radial-gradient(120% 80% at 12% 100%, #7cbc6a 0 42%, transparent 43%),
        radial-gradient(90% 90% at 48% 110%, #69a85e 0 48%, transparent 49%),
        radial-gradient(110% 90% at 86% 100%, #81c472 0 46%, transparent 47%);
    }

    .ground {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 22%;
      background: linear-gradient(#5aa85a, #3f8a44 40%, #35753a);
    }

    .road {
      position: absolute;
      bottom: 7%;
      left: -5%;
      width: 110%;
      height: 86px;
      background: #4a4a4a;
      border-top: 8px solid #3a3a3a;
      border-bottom: 10px solid #2f2f2f;
      transform: perspective(240px) rotateX(8deg);
      overflow: hidden;
    }

    .dash {
      position: absolute;
      top: 50%;
      left: 0;
      width: 200%;
      height: 8px;
      transform: translateY(-50%);
      background: repeating-linear-gradient(
        90deg,
        #f4d35e 0 48px,
        transparent 48px 86px
      );
      animation: dash 0.7s linear infinite;
    }

    @keyframes dash {
      from { transform: translate(-86px, -50%); }
      to   { transform: translate(0, -50%); }
    }

    .title {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: #1d3557;
      text-align: center;
      text-shadow: 0 2px 0 rgba(255,255,255,0.45);
      z-index: 5;
    }

    .title h1 {
      font-size: clamp(22px, 4vw, 40px);
      letter-spacing: 0.08em;
    }

    .title p {
      margin-top: 6px;
      font-size: 14px;
      opacity: 0.8;
    }

    .rider-wrap {
      position: absolute;
      bottom: 11%;
      left: 0;
      width: 100%;
      height: 280px;
      z-index: 4;
      pointer-events: none;
    }

    .rider {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 340px;
      height: 260px;
      margin-left: -170px;
      animation: bob 0.45s ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    svg { overflow: visible; }

    .wheel {
      transform-origin: center;
      animation: spin 0.55s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .pedal-arm {
      transform-origin: 118px 198px;
      animation: spin 0.55s linear infinite;
    }

    .crank-right {
      transform-origin: 118px 198px;
      animation: spin 0.55s linear infinite;
    }

    .leg-front {
      transform-origin: 148px 148px;
      animation: pedal-front 0.55s linear infinite;
    }

    .leg-back {
      transform-origin: 142px 146px;
      animation: pedal-back 0.55s linear infinite;
    }

    @keyframes pedal-front {
      0%   { transform: rotate(18deg); }
      25%  { transform: rotate(-8deg); }
      50%  { transform: rotate(-22deg); }
      75%  { transform: rotate(6deg); }
      100% { transform: rotate(18deg); }
    }

    @keyframes pedal-back {
      0%   { transform: rotate(-22deg); }
      25%  { transform: rotate(6deg); }
      50%  { transform: rotate(18deg); }
      75%  { transform: rotate(-8deg); }
      100% { transform: rotate(-22deg); }
    }

    .wing {
      transform-origin: 168px 108px;
      animation: flap 0.9s ease-in-out infinite;
    }

    @keyframes flap {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-14deg); }
    }

    .beak {
      transform-origin: 214px 92px;
      animation: nibble 2.4s ease-in-out infinite;
    }

    @keyframes nibble {
      0%, 70%, 100% { transform: rotate(0); }
      78% { transform: rotate(6deg); }
      86% { transform: rotate(-2deg); }
    }

    .dust {
      position: absolute;
      bottom: 18%;
      left: calc(50% - 210px);
      width: 70px;
      height: 18px;
      z-index: 3;
    }

    .puff {
      position: absolute;
      width: 10px;
      height: 10px;
      background: rgba(255,255,255,0.55);
      border-radius: 50%;
      animation: puff 0.7s ease-out infinite;
    }

    .puff:nth-child(2) { left: 16px; animation-delay: 0.18s; }
    .puff:nth-child(3) { left: 32px; animation-delay: 0.36s; }

    @keyframes puff {
      0%   { transform: translate(0, 0) scale(0.4); opacity: 0.7; }
      100% { transform: translate(-40px, -18px) scale(1.4); opacity: 0; }
    }

    .flower {
      position: absolute;
      bottom: 16%;
      width: 14px;
      height: 28px;
      animation: sway 2.8s ease-in-out infinite;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(8deg); }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="hills"></div>
    <div class="ground"></div>
    <div class="road"><div class="dash"></div></div>

    <div class="title">
      <h1>鹈鹕骑自行车</h1>
      <p>A pelican on a bicycle</p>
    </div>

    <div class="flower" style="left:12%">
      <svg viewBox="0 0 20 40" width="20" height="40">
        <rect x="9" y="16" width="2" height="22" fill="#2d6a4f"/>
        <circle cx="10" cy="12" r="8" fill="#ffafcc"/>
        <circle cx="10" cy="12" r="3" fill="#ffd166"/>
      </svg>
    </div>
    <div class="flower" style="left:78%; animation-delay:-1s">
      <svg viewBox="0 0 20 40" width="20" height="40">
        <rect x="9" y="16" width="2" height="22" fill="#2d6a4f"/>
        <circle cx="10" cy="12" r="8" fill="#90e0ef"/>
        <circle cx="10" cy="12" r="3" fill="#ffd166"/>
      </svg>
    </div>

    <div class="dust">
      <div class="puff"></div>
      <div class="puff"></div>
      <div class="puff"></div>
    </div>

    <div class="rider-wrap">
      <div class="rider">
        <svg viewBox="0 0 340 260" width="340" height="260">
          <!-- rear wheel -->
          <g class="wheel" transform="translate(70,198)">
            <circle r="42" fill="none" stroke="#222" stroke-width="7"/>
            <circle r="36" fill="none" stroke="#888" stroke-width="2"/>
            <circle r="8" fill="#333"/>
            <g stroke="#444" stroke-width="2">
              <line x1="0" y1="-36" x2="0" y2="36"/>
              <line x1="-36" y1="0" x2="36" y2="0"/>
              <line x1="-25" y1="-25" x2="25" y2="25"/>
              <line x1="25" y1="-25" x2="-25" y2="25"/>
            </g>
          </g>

          <!-- front wheel -->
          <g class="wheel" transform="translate(248,198)">
            <circle r="42" fill="none" stroke="#222" stroke-width="7"/>
            <circle r="36" fill="none" stroke="#888" stroke-width="2"/>
            <circle r="8" fill="#333"/>
            <g stroke="#444" stroke-width="2">
              <line x1="0" y1="-36" x2="0" y2="36"/>
              <line x1="-36" y1="0" x2="36" y2="0"/>
              <line x1="-25" y1="-25" x2="25" y2="25"/>
              <line x1="25" y1="-25" x2="-25" y2="25"/>
            </g>
          </g>

          <!-- bike frame -->
          <g fill="none" stroke="#e63946" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M70 198 L118 198 L148 128 L230 128"/>
            <path d="M118 198 L168 128"/>
            <path d="M148 128 L118 198"/>
            <path d="M230 128 L248 198"/>
            <path d="M230 128 L248 98"/>
          </g>
          <circle cx="118" cy="198" r="7" fill="#222"/>
          <path d="M238 94 h28" stroke="#222" stroke-width="7" stroke-linecap="round"/>
          <path d="M154 120 q8 -18 0 -28" stroke="#222" stroke-width="6" fill="none" stroke-linecap="round"/>
          <ellipse cx="154" cy="112" rx="16" ry="7" fill="#1d3557"/>

          <!-- pedals -->
          <g class="crank-right">
            <line x1="118" y1="198" x2="118" y2="222" stroke="#222" stroke-width="5" stroke-linecap="round"/>
            <rect x="108" y="218" width="20" height="7" rx="2" fill="#333"/>
          </g>

          <!-- back leg (far) -->
          <g class="leg-back">
            <path d="M142 146 Q128 176 110 204" fill="none" stroke="#f4a261" stroke-width="14" stroke-linecap="round"/>
            <ellipse cx="106" cy="210" rx="12" ry="7" fill="#e76f51"/>
          </g>

          <!-- pelican body -->
          <ellipse cx="168" cy="118" rx="46" ry="34" fill="#f8f4e8"/>
          <ellipse cx="168" cy="126" rx="32" ry="18" fill="#ece6d4"/>

          <!-- wing -->
          <g class="wing">
            <ellipse cx="150" cy="118" rx="34" ry="16" fill="#e9e1c8" transform="rotate(-18 150 118)"/>
            <path d="M128 118 Q118 132 136 136" fill="none" stroke="#d6ccb0" stroke-width="3"/>
          </g>

          <!-- front leg -->
          <g class="leg-front">
            <path d="M148 148 Q136 176 128 214" fill="none" stroke="#f4a261" stroke-width="14" stroke-linecap="round"/>
            <ellipse cx="126" cy="220" rx="12" ry="7" fill="#e76f51"/>
          </g>

          <!-- neck + head -->
          <path d="M196 108 Q214 92 220 78" fill="none" stroke="#f8f4e8" stroke-width="16" stroke-linecap="round"/>
          <circle cx="228" cy="70" r="22" fill="#f8f4e8"/>
          <circle cx="236" cy="66" r="5" fill="#1d3557"/>
          <circle cx="237.5" cy="64.5" r="1.6" fill="#fff"/>
          <path d="M214 58 Q228 42 246 54" fill="#e9e1c8"/>

          <!-- pouch / beak -->
          <g class="beak">
            <path d="M246 72 Q278 68 292 82 Q276 108 244 92 Q240 82 246 72Z" fill="#f4a261"/>
            <path d="M246 72 Q278 64 294 78" fill="none" stroke="#e76f51" stroke-width="5" stroke-linecap="round"/>
          </g>

          <!-- little crest -->
          <path d="M216 52 Q210 40 222 46" fill="none" stroke="#e9e1c8" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
